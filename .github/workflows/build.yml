name: build-nx721j-droidspaces-kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: nethunter
            enable_cfs: 0
            enable_pids: 0
            net_hunter: 1
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            cpio lz4 zstd dwarves python3 kmod zip unzip xz-utils

      - name: Install AOSP clang r487747c (same compiler as the stock kernel)
        run: |
          mkdir -p $HOME/clang
          curl -L --retry 3 -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-14.0.0_r1/clang-r487747c.tar.gz"
          tar xzf clang.tar.gz -C $HOME/clang
          $HOME/clang/bin/clang --version | head -1
          echo "LLVM_BIN=$HOME/clang/bin" >> $GITHUB_ENV

      - name: Build kernel (${{ matrix.variant }})
        run: |
          export PATH="$LLVM_BIN:$PATH"
          export LLVM=1
          export PATCH_VARIANT=3_4_5
          export ENABLE_CFS="${{ matrix.enable_cfs }}"
          export ENABLE_PIDS="${{ matrix.enable_pids }}"
          export NET_HUNTER="${{ matrix.net_hunter }}"
          bash build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nx721j-kernel-${{ matrix.variant }}
          path: |
            out/Image
            out/modules
          retention-days: 30
