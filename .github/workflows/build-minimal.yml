name: build-nx721j-minimal

on:
  workflow_dispatch:
  push:
    paths:
      - 'config-minimal.fragment'
      - '.github/workflows/build-minimal.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            cpio lz4 zstd dwarves python3 kmod zip unzip xz-utils
      - name: Install AOSP clang r487747c
        run: |
          mkdir -p $HOME/clang
          curl -L --retry 3 -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-14.0.0_r1/clang-r487747c.tar.gz"
          tar xzf clang.tar.gz -C $HOME/clang
          echo "LLVM_BIN=$HOME/clang/bin" >> $GITHUB_ENV
      - name: Build kernel (minimal, 3_4_5)
        run: |
          export PATH="$LLVM_BIN:$PATH"
          export LLVM=1
          export PATCH_VARIANT=3_4_5
          export FRAGMENT="$PWD/config-minimal.fragment"
          bash build.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: nx721j-minimal
          path: out/Image
          retention-days: 30
