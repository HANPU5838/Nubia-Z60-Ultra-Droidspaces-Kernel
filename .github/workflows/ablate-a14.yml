name: ablate-a14-groups

on:
  push:
    tags: [ 'ablate*' ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        group: [g1, g2, g3, g4, g5, g6, g7]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            cpio lz4 zstd dwarves python3 kmod zip unzip xz-utils
      - name: Install AOSP clang r487747c
        run: |
          mkdir -p $HOME/clang
          curl -L --retry 3 -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-14.0.0_r1/clang-r487747c.tar.gz"
          tar xzf clang.tar.gz -C $HOME/clang
          echo "LLVM_BIN=$HOME/clang/bin" >> $GITHUB_ENV
      - name: Build group ${{ matrix.group }}
        run: |
          export PATH="$LLVM_BIN:$PATH"
          export LLVM=1
          FRAGMENT_FILE="config.fragment.${{ matrix.group }}" VARIANT="${{ matrix.group }}" bash build-a14.sh
      - name: Upload symvers + Image
        uses: actions/upload-artifact@v4
        with:
          name: symvers-${{ matrix.group }}
          path: |
            out-a14-${{ matrix.group }}/Module.symvers
            out-a14-${{ matrix.group }}/Image
          retention-days: 30

  check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all group artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Vendor CRC check per group
        run: |
          set +e
          for g in g1 g2 g3 g4 g5 g6 g7; do
            f="artifacts/symvers-$g/Module.symvers"
            if [ -f "$f" ]; then
              echo "================ $g ================"
              python3 scripts/vendor_crc_check.py "$f" | tail -8
              echo "group $g exit: $?"
            else
              echo "================ $g ================"
              echo "symvers missing (build failed)"
            fi
          done
